{% extends 'base.html' %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="mx-auto max-w-3xl space-y-6">
    <header class="rounded-[2rem] border border-white/10 bg-white/5 px-6 py-6 shadow-2xl shadow-black/20 backdrop-blur sm:px-8">
        <p class="text-xs font-semibold uppercase tracking-[0.32em] text-rose-300">{{ page_badge }}</p>
        <h1 class="mt-3 text-3xl font-semibold tracking-tight text-white sm:text-4xl">{{ page_heading }}</h1>
        <p class="mt-3 text-sm leading-7 text-stone-300">{{ page_description }}</p>
    </header>

    <section class="rounded-[2rem] border border-rose-300/20 bg-rose-300/10 p-6 backdrop-blur sm:p-8">
        <div class="rounded-3xl border border-white/10 bg-stone-950/60 p-6">
            <p class="text-sm text-stone-400">削除対象</p>
            <p class="mt-2 text-2xl font-semibold text-white">{{ object }}</p>
        </div>

        <form method="post" class="mt-6 flex flex-wrap gap-3">
            {% csrf_token %}
            <button type="submit" class="inline-flex items-center justify-center rounded-full bg-rose-300 px-5 py-3 text-sm font-semibold text-stone-950 transition hover:bg-rose-200">
                削除する
            </button>
            <a href="{{ cancel_url }}" class="inline-flex items-center justify-center rounded-full border border-white/15 bg-white/5 px-5 py-3 text-sm font-semibold text-white transition hover:bg-white/10">
                キャンセル
            </a>
        </form>
    </section>
</div>
{% endblock %}
